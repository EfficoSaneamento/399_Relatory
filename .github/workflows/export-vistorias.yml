name: Exportar vistorias ArcGIS

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/export-vistorias.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: "export-vistorias"
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências Python
        run: pip install -r requirements.txt
      - name: Exportar dados e imagens
        env:
          ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
          ARCGIS_SERVICE_URL: https://services6.arcgis.com/QJAp6nG4ishOkuMg/arcgis/rest/services/service_95186ff112e345eda73abaf81f8b18a7/FeatureServer
        run: python scripts/export_vistorias.py
      - name: Publicar dados atualizados
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data public/attachments
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualizar vistorias exportadas"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Acionar publicação do site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
